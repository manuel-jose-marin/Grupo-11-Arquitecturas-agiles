services:
  gateway:
    build: ./gateway
    container_name: exp2-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      VERIFIER_URL: http://verifier:8080/verify
      RESERVATIONS_QUERY_URL: http://reservations:8080/reservations/by-request
      REQUEST_TIMEOUT_SECS: "10"
    ports:
      - "8080:8080"
    networks: [travelhubsecnet]

  # Pendiente habilitar
