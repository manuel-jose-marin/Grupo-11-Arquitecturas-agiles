  #    RABBIT_HOST: rabbitmq
  #    RABBIT_USER: guest
  #    RABBIT_PASS: guest
  #  networks: [travelhubsecnet]

  reservations:
    build: ./reservations
    container_name: exp2-reservations
    restart: unless-stopped
    environment:
      PORT: "8080"
      SQLITE_PATH: /data/reservations.db
    volumes:
      - reservations_data:/data
    networks: [travelhubsecnet]
