global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "verifier"
    static_configs:
      - targets: ["verifier:8080"]

  - job_name: "reservations"
    static_configs:
      - targets: ["reservations:8080"]

  - job_name: "auditlog"
    static_configs:
      - targets: ["auditlog:8080"]

  - job_name: "rabbitmq_exporter"
    static_configs:
      - targets: ["rabbitmq_exporter:9419"]
